name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.14.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      - run: pnpm install --no-frozen-lockfile
      - name: Verify local check dependencies
        run: |
          node -e "const {createRequire}=require('node:module'); const r=createRequire(process.cwd()+'/package.json'); for(const p of ['@astrojs/check','typescript']) console.log(p, r.resolve(p))"
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm check
      - run: test -f dist/index.html
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - name: Upload Playwright evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retro-visual-review
          path: |
            test-results/
            browser-review/
          if-no-files-found: ignore
